# Applied at every start. The admin password is generated on the EC2 host into Jenkins' own secrets dir.
jenkins:
  systemMessage: "nv-cicd-demo: Jenkins CI + NeuVector scan"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${readFile:/var/jenkins_home/secrets/nv-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "DOCKERHUB_NAMESPACE"
            value: "${DOCKERHUB_NAMESPACE}"
          - key: "GITOPS_REPO"
            value: "${GITOPS_REPO}"
unclassified:
  location:
    url: "http://localhost:8080/"
