apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nv-cicd-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yansheng133/nv-cicd-demo.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: nv-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
